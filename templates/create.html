<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>New Ticket | Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-700 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">🎫 Support CRM</h1>
    <a href="/" class="bg-white text-blue-700 px-4 py-2 rounded font-semibold hover:bg-blue-50">← All Tickets</a>
  </nav>

  <div class="max-w-xl mx-auto mt-10 bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Create New Ticket</h2>
    <div id="successMsg" class="hidden bg-green-100 text-green-700 px-4 py-3 rounded mb-4"></div>
    <div id="errorMsg" class="hidden bg-red-100 text-red-700 px-4 py-3 rounded mb-4"></div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name *</label>
        <input id="customer_name" type="text" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="John Doe"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Email *</label>
        <input id="customer_email" type="email" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="john@example.com"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Subject *</label>
        <input id="subject" type="text" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Brief issue title"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
        <textarea id="description" rows="4" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Describe the issue in detail..."></textarea>
      </div>
      <button onclick="submitTicket()" class="w-full bg-blue-700 text-white py-2 rounded font-semibold hover:bg-blue-800 transition">
        Submit Ticket
      </button>
    </div>
  </div>

  <script>
    async function submitTicket() {
      const body = {
        customer_name: document.getElementById("customer_name").value.trim(),
        customer_email: document.getElementById("customer_email").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        description: document.getElementById("description").value.trim()
      };

      if (!body.customer_name || !body.customer_email || !body.subject || !body.description) {
        document.getElementById("errorMsg").textContent = "All fields are required.";
        document.getElementById("errorMsg").classList.remove("hidden");
        return;
      }

      const res = await fetch("/api/tickets", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById("successMsg").textContent = `Ticket ${data.ticket_id} created! Redirecting...`;
        document.getElementById("successMsg").classList.remove("hidden");
        document.getElementById("errorMsg").classList.add("hidden");
        setTimeout(() => window.location.href = `/ticket/${data.ticket_id}`, 1500);
      } else {
        document.getElementById("errorMsg").textContent = "Error creating ticket.";
        document.getElementById("errorMsg").classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
