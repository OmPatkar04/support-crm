<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-700 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">🎫 Support CRM</h1>
    <a href="/create" class="bg-white text-blue-700 px-4 py-2 rounded font-semibold hover:bg-blue-50">+ New Ticket</a>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <!-- Search & Filter -->
    <div class="flex flex-col md:flex-row gap-3 mb-6">
      <input id="searchInput" type="text" placeholder="Search by name, email, ID..."
        class="flex-1 border rounded px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        oninput="loadTickets()" />
      <select id="statusFilter" onchange="loadTickets()"
        class="border rounded px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="">All Status</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <!-- Stats -->
    <div id="statsBar" class="flex gap-4 mb-4 text-sm font-medium"></div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-blue-50 text-blue-700 uppercase text-xs">
          <tr>
            <th class="px-4 py-3">Ticket ID</th>
            <th class="px-4 py-3">Customer</th>
            <th class="px-4 py-3">Subject</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3">Created</th>
            <th class="px-4 py-3">Action</th>
          </tr>
        </thead>
        <tbody id="ticketTable" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
    <p id="noResults" class="text-center text-gray-400 mt-8 hidden">No tickets found.</p>
  </div>

  <script>
    const statusColors = {
      "Open": "bg-red-100 text-red-700",
      "In Progress": "bg-yellow-100 text-yellow-700",
      "Closed": "bg-green-100 text-green-700"
    };

    async function loadTickets() {
      const search = document.getElementById("searchInput").value;
      const status = document.getElementById("statusFilter").value;
      let url = `/api/tickets?`;
      if (search) url += `search=${encodeURIComponent(search)}&`;
      if (status) url += `status=${encodeURIComponent(status)}`;

      const res = await fetch(url);
      const tickets = await res.json();
      const tbody = document.getElementById("ticketTable");
      const noResults = document.getElementById("noResults");

      tbody.innerHTML = "";
      if (tickets.length === 0) { noResults.classList.remove("hidden"); return; }
      noResults.classList.add("hidden");

      tickets.forEach(t => {
        const color = statusColors[t.status] || "bg-gray-100 text-gray-700";
        const date = new Date(t.created_at).toLocaleDateString();
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-4 py-3 font-mono font-semibold text-blue-600">${t.ticket_id}</td>
            <td class="px-4 py-3">${t.customer_name}</td>
            <td class="px-4 py-3">${t.subject}</td>
            <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${color}">${t.status}</span></td>
            <td class="px-4 py-3 text-gray-500">${date}</td>
            <td class="px-4 py-3"><a href="/ticket/${t.ticket_id}" class="text-blue-600 hover:underline font-medium">View →</a></td>
          </tr>`;
      });
    }

    loadTickets();
  </script>
</body>
</html>
